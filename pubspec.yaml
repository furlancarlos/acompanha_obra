# pubspec.yaml
# Arquivo de definição do pacote flutter que será responsável por definir
# as dependências do projeto.
# Para saber mais sobre o pubspec.yaml, visite:
# https://dart.dev/tools/pub/pubspec
#===========================================================================//

name: acompanha_obra
description: "Aplicativo para acompanhamento de despesas de obra"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.3
  sqflite: ^2.3.0
  path: ^1.9.0
  cupertino_icons: ^1.0.8
  # Para backup
  path_provider: ^2.1.0
  permission_handler: ^12.0.3
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3
  sqlite3_flutter_libs: ^0.6.0+eol

flutter:
  uses-material-design: true
  assets:
    - assets/construcao.png
  